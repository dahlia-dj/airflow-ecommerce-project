x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ""
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  ECOMMERCE_DATA_DIR: /opt/airflow/data
  MONGO_URI: mongodb://mongodb:27017

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - ./data:/opt/airflow/data
  - ./scripts:/opt/airflow/scripts
  - airflow_logs:/opt/airflow/logs

services:

  postgres:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: ecommerce-airflow:latest
    container_name: airflow_init
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      - postgres
      - mongodb
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
        airflow connections add 'fs_default' --conn-type fs --conn-extra '{"path": "/"}' || true

  airflow-webserver:
    image: ecommerce-airflow:latest
    container_name: airflow_webserver
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
      - airflow-init

  airflow-scheduler:
    image: ecommerce-airflow:latest
    container_name: airflow_scheduler
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    depends_on:
      - postgres
      - mongodb
      - airflow-init

  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  postgres_data:
  mongo_data:
  airflow_logs:
  jenkins_home:
